<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анализ сайтов: Творчество и рукоделие</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ff;--fg:#1b1530;--mut:#5d5578;--card:rgba(255,255,255,.7);--line:rgba(27,21,48,.14);--a:#e0457b;--b:#6b4cf0;--c:#f0902f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b14;--fg:#f4f0ff;--mut:#a79fc0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--a:#ff6b9d;--b:#8b6cff;--c:#ffb86b}}
:root[data-theme="dark"]{--bg:#0d0b14;--fg:#f4f0ff;--mut:#a79fc0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--a:#ff6b9d;--b:#8b6cff;--c:#ffb86b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;position:relative}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;animation:fl 18s ease-in-out infinite alternate}
body::before{background:var(--b);left:-20vmax;top:-25vmax}
body::after{background:var(--a);right:-25vmax;bottom:-30vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:linear-gradient(90deg,var(--a),var(--c));z-index:9;transition:width .5s}
.s{position:absolute;inset:0;z-index:1;padding:clamp(24px,5vh,56px) clamp(20px,6vw,88px) 84px;display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(20px,4vw,64px);align-items:center;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;overflow-y:auto}
.s.on{opacity:1;pointer-events:auto;transform:none}
.s.solo{grid-template-columns:1fr;max-width:1000px;margin:auto}
.s.two{grid-template-columns:1fr;align-content:center;gap:20px}
.num{position:absolute;right:4vw;top:2vh;font:700 clamp(80px,16vw,220px)/1 Unbounded,sans-serif;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none}
.tx{position:relative}
.kick{font:600 12px Manrope;letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin-bottom:14px}
h1{font:700 clamp(26px,4vw,56px)/1.1 Unbounded,sans-serif;letter-spacing:-.02em}
.hero h1{font-size:clamp(28px,4.6vw,66px);background:linear-gradient(100deg,var(--fg) 30%,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.two h1{font-size:clamp(24px,3.4vw,48px)}
.sub{color:var(--mut);font-size:clamp(15px,1.5vw,20px);margin-top:14px;max-width:44ch}
ul{list-style:none;margin-top:22px;display:grid;gap:12px;padding:0}
li{padding:14px 18px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);border-radius:16px;font-size:clamp(14px,1.3vw,17px);line-height:1.5;border-left:3px solid var(--a)}
.q{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.q b{font:700 13px Unbounded;color:var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.tags b{font:700 12px Manrope;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:99px;background:linear-gradient(120deg,var(--a),var(--b));color:#fff}
.vis{position:relative;display:grid;gap:18px;min-width:0}
.two .vis{grid-template-columns:1fr 1fr}
.shot{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);background:var(--card);transition:transform .4s}
.shot:hover{transform:translateY(-6px) rotate(-.4deg)}
.bar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--card);font-size:11px;color:var(--mut)}
.bar i{width:9px;height:9px;border-radius:50%;background:var(--a);opacity:.8}
.bar i:nth-child(2){background:var(--c)}.bar i:nth-child(3){background:var(--b)}
.bar span{margin-left:10px}
.pic{aspect-ratio:4/3;overflow:hidden;position:relative}
.two .pic{aspect-ratio:16/9}
.pic div{position:absolute;inset:0;background-size:cover;background-position:top;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.lk{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);background:var(--card);border-radius:16px;color:var(--fg);text-decoration:none;margin-top:12px;overflow-wrap:anywhere}
.lk:hover{border-color:var(--a)}.lk span{color:var(--mut);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
nav button:hover{background:var(--a);color:#fff}
#cnt{font:600 13px Unbounded;color:var(--mut);min-width:70px;text-align:center}
@media(max-width:820px){.s{grid-template-columns:1fr;align-content:start}.two .vis{grid-template-columns:1fr}}
</style></head><body>
<div id="prog"></div><div id="deck"></div>

{k:'Вопрос 4',t:'Почему CERAMIC.lv — лендинг?',s:'Не только «одна страница»: важен единый целевой сценарий',p:['Страница последовательно знакомит с услугой: мастер-классы → мероприятия → подарочные карты → реальные работы.','Главное действие повторяется — Book a workshop / Book Private events. Это характерно для посадочной страницы.'],tags:['Оффер → CTA','Блоки → повторный CTA'],im:[[1]]},
{k:'Лендинг · 5',t:'Оффер',s:'Что именно предлагают посетителю',p:['Занятия по керамике, частные мероприятия и handmade ceramics.','На первом экране сразу объясняется ценность: работать с глиной можно независимо от опыта.'],tags:['Shape something beautiful','Create. Learn. Connect.'],im:[[1,1.5,'50% 30%']]},
{k:'Лендинг · 6',t:'Первый экран',s:'Понятно ли сразу, что предлагают, кому и зачем?',p:['Да, смысл считывается сразу: керамические занятия, события и создание изделий своими руками.','Заголовок даёт эмоциональный результат, описание уточняет формат, а CTA предлагает следующий шаг.'],tags:['Что предлагают','Для кого / зачем','CTA'],im:[[1,1.25,'50% 30%']]},
{k:'Лендинг · 7',t:'Основной CTA',s:'Как выделено целевое действие',p:['Главная кнопка тёмная и контрастная, поэтому выделяется на светлом фоне.','CTA расположен сразу под описанием предложения. Внизу страницы действие повторяется, когда посетитель уже познакомился с услугой.'],tags:['Book a workshop'],im:[[1,2.3,'45% 52%']]},
{k:'Лендинг · 8',t:'Ключевые блоки',s:'Каждый блок отвечает на конкретный вопрос посетителя',l:[['WORKSHOPS','какие занятия доступны?'],['PRIVATE EVENTS','можно ли провести мероприятие?'],['GIFT CARDS','можно ли подарить занятие?'],['HANDMADE CERAMICS','что создают в студии?'],['MADE BY YOU / GALLERY','какой получится результат?']],im:[[1,1.8,'50% 100%']]},
{k:'Лендинг · 9',t:'Элементы доверия',s:'Что помогает поверить предложению',p:['Галерея показывает реальные результаты участников.','Информация о студии и авторе объясняет, кто проводит занятия.','Материалы в блоге поддерживают экспертность и показывают активность проекта.'],tags:['Реальные работы','Блог / экспертность'],im:[[1,1.2,'50% 100%']]},
{k:'Лендинг · 10',t:'Путь после CTA',s:'Что происходит после нажатия кнопки',p:['После CTA пользователь переходит к дальнейшему шагу записи на мастер-класс.','Дальше нужно выбрать подходящий вариант и продолжить оформление. Реальную заявку отправлять не требуется — достаточно показать переход и следующий экран.'],tags:['Book a workshop →'],im:[[1,1.6,'50% 50%']]},
{k:'Лендинг · 11 · Плюс',t:'Удачное решение',s:'Повторный CTA после знакомства с предложением',p:['Целевое действие не спрятано: «Book a workshop» видно сразу.','После знакомства с услугой пользователь снова получает возможность записаться.','Влияние: меньше лишних действий и понятнее путь к результату.'],tags:['CTA сразу в первом экране'],im:[[1,2,'45% 52%']]},
{k:'Лендинг · 12 · Минус',t:'Недостаток лендинга',s:'Что можно улучшить',p:['На первом экране не видны цена, ближайшее время или длительность занятия.','Для эмоционального знакомства это работает хорошо, но для быстрого решения посетителю может понадобиться дополнительный переход.'],tags:['Нет цены на первом экране','Нет ближайшей даты'],im:[[1,1.3,'50% 35%']]},

const shot=([n,z=1,o='50% 0%'])=>`<figure class="shot"><div class="bar"><i></i><i></i><i></i><span>${N[n]}</span></div><div class="pic"><div style="background-image:var(--i${n});transform:scale(${z});transform-origin:${o}"></div></div></figure>`;
document.getElementById('deck').innerHTML=S.map((d,i)=>{
const two=d.im&&d.im.length>1,solo=!d.im;
return `<section class="s ${two?'two':''} ${solo?'solo':''} ${d.hero?'hero':''}"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="tx"><div class="kick">${d.k}</div><h1>${d.t}</h1><p class="sub">${d.s}</p>${d.p?'<ul>'+d.p.map(x=>`<li>${x}</li>`).join('')+'</ul>':''}${d.l?'<ul>'+d.l.map(x=>`<li class="q"><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+'</ul>':''}${d.lk?d.lk.map(x=>`<a class="lk" href="${x[1]}" target="_blank" rel="noopener"><strong>${x[0]}</strong><span>${x[1]}</span></a>`).join(''):''}${d.tags?'<div class="tags">'+d.tags.map(t=>`<b>${t}</b>`).join('')+'</div>':''}</div>${d.im?'<div class="vis">'+d.im.map(shot).join('')+'</div>':''}</section>`}).join('');
const el=[...document.querySelectorAll('.s')];let c=0;
function go(n){c=Math.max(0,Math.min(el.length-1,n));el.forEach((e,i)=>e.classList.toggle('on',i===c));
document.getElementById('cnt').textContent=(c+1)+' / '+el.length;document.getElementById('prog').style.width=((c+1)/el.length*100)+'%';
try{history.replaceState(null,'','#'+(c+1))}catch(e){}}
document.getElementById('pv').onclick=()=>go(c-1);document.getElementById('nx').onclick=()=>go(c+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(c+1)}else if(['ArrowLeft','PageUp'].includes(e.key))go(c-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(el.length-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(c+(d<0?1:-1));x0=null});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
